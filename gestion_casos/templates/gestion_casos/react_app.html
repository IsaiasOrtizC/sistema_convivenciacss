{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="ConviData, plataforma de gestión de convivencia escolar." />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <meta name="theme-color" content="#7B1A1A" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />

    <title>ConviData | Convivencia escolar</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any" />

    <!-- Detección inmediata de tema (preferencia guardada o tema del sistema) -->
    <script>
      (() => {
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const apply = () => {
          let saved = null;
          try {
            saved = window.localStorage.getItem('convidata-theme');
          } catch (_) {}
          const theme = (saved === 'dark' || saved === 'light')
            ? saved
            : (mq.matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        };
        apply();
        if (mq.addEventListener) mq.addEventListener('change', apply);
        else mq.addListener(apply);
      })();
    </script>

    <!-- Precarga del bundle de React para descargarlo en paralelo con el CSS -->
    <link rel="modulepreload" href="{% static 'react/assets/app.js' %}" />
    <link rel="stylesheet" href="{% static 'react/assets/index.css' %}" />

    <!-- Fuente de respaldo no bloqueante (macOS/iOS usan SF Pro nativo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Estilos base + skeleton mínimo mientras monta React -->
    <style>
      :root {
        color-scheme: light dark;
        --bg-base: #F5F5F7;
        --text-main: #1D1D1F;
        --accent: #7B1A1A;
      }
      html[data-theme="dark"] {
        --bg-base: #121214;
        --text-main: #F5F5F7;
        --accent: #F0C030;
      }
      html, body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--bg-base);
        color: var(--text-main);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .app-boot-loader {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .app-boot-spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid rgba(134, 134, 139, 0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>
      <p style="padding: 1.5rem; text-align: center;">
        ConviData requiere JavaScript habilitado para funcionar correctamente.
      </p>
    </noscript>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite" aria-label="Cargando ConviData">
        <div class="app-boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="{% static 'react/assets/app.js' %}"></script>
  </body>
</html>
